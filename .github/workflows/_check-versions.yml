name: _check-versions

# Reusable: stamp the incoming version into every dist manifest, then assert it
# took. Dist never tags independently — the version is the one committed in the
# manifests (bumped by prepare-release.yml's PR and read back by the publisher).

on:
  workflow_call:
    inputs:
      version:
        description: "Toolchain release version, e.g. 'v0.3.2'."
        type: string
        required: true

jobs:
  check:
    name: Stamp + verify manifest versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Stamp manifests to the release version
        # Ephemeral pre-flight: stamps this throwaway checkout and asserts every
        # manifest took the release version, catching a structural regression
        # before any channel publishes. main's committed manifests are made
        # authoritative separately, by prepare-release.yml — it stamps them into
        # a human-gated release/v* PR whose merge triggers the publisher, so no
        # committed pin is ever stale (#11).
        run: make stamp-versions VERSION=${{ inputs.version }}
      - name: Verify every manifest matches
        run: make check-versions VERSION=${{ inputs.version }}
