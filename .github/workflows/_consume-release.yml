name: Consume Release

# Entry point. Fired by the toolchain repo (jmbarzee/temporal-architect) via
# repository_dispatch after it cuts a GitHub Release. The payload carries the
# version; this repo downloads that Release's assets, stamps the version into
# every manifest, repackages, and publishes to every registry in lockstep.
#
# Manual re-run: use the "Run workflow" button (workflow_dispatch) with a
# version, e.g. to re-publish a channel that failed.

on:
  repository_dispatch:
    types: [toolchain-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Toolchain release version to consume, e.g. v0.3.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          V="${{ github.event.client_payload.version || inputs.version }}"
          if [ -z "$V" ]; then echo "No version in dispatch payload or input"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Consuming toolchain release $V"

  check-versions:
    needs: resolve-version
    uses: ./.github/workflows/_check-versions.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-vsix:
    # Independent of npm: the extension builds against the wire-types tarball from
    # the toolchain Release (see Makefile stamp-versions), not the published package.
    needs: [resolve-version, check-versions]
    uses: ./.github/workflows/_publish-vsix.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

  # npm channels authenticate via trusted publishing (OIDC) — no NPM_TOKEN.
  # npm validates the *calling* (top-level) workflow filename, so the trusted
  # publisher for every @temporal-architect/* package published HERE is
  # configured on npmjs.com as repo=temporal-architect-dist,
  # workflow=_consume-release.yml. id-token:write must be granted on BOTH this
  # caller job and the reusable workflow it calls.
  #
  # The visualizer + wire-types LIBRARIES are not published here — the toolchain
  # publishes them (repository.url = toolchain, so provenance succeeds). This
  # repo only consumes their Release tarballs at build time.
  publish-npm-twf:
    needs: [resolve-version, check-versions]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-twf.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-pypi:
    needs: [resolve-version, check-versions]
    uses: ./.github/workflows/_publish-pypi.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-npm-claude-plugin:
    needs: [resolve-version, check-versions]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-claude-plugin.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-brew:
    # The toolchain Release already exists (it triggered this run), so the
    # formula's URLs + SHAs are pinnable immediately.
    needs: [resolve-version, check-versions]
    uses: ./.github/workflows/_publish-brew.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  commit-manifests:
    # Make main's committed manifests honest. Every other job publishes to a
    # registry from an ephemeral stamped checkout, but the committed values on
    # main don't move — so they drift stale (issue #11) and read as a version
    # nobody shipped. This job stamps the committed version fields on main and
    # pushes them back, so marketplace.json (which Claude Code reads straight
    # from git) is always current and no manifest advertises a phantom version.
    #
    # Gated on ALL publishes: main never claims a version the registries lack.
    # It stamps only the *committed* subset (stamp-committed-versions, never the
    # full stamp-versions with its build-only file: deps) and stages only the
    # manifest paths, so a build artifact can never leak into a commit. Idempotent
    # — a re-run whose main is already current makes no commit. main has no branch
    # protection, so the workflow token can push directly.
    needs:
      - resolve-version
      - publish-vsix
      - publish-npm-twf
      - publish-pypi
      - publish-npm-claude-plugin
      - publish-brew
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stamp committed manifest versions
        run: make stamp-committed-versions VERSION=${{ needs.resolve-version.outputs.version }}
      - name: Commit + push if anything changed
        run: |
          set -euo pipefail
          git add .claude-plugin/marketplace.json \
                  packages/vscode/package.json \
                  packages/npm/twf/package.json \
                  packages/npm/twf-*/package.json \
                  packages/npm/claude-plugin/package.json \
                  packages/pypi/twf-cli/pyproject.toml \
                  packages/pypi/twf-cli/src/twf_cli/__init__.py
          if git diff --cached --quiet; then
            echo "Committed manifests already at ${{ needs.resolve-version.outputs.version }} — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: stamp committed manifests to v${{ needs.resolve-version.outputs.version }} [skip ci]"
          git push origin HEAD:main
