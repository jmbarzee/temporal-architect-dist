name: Publish Release

# Publishes every consumption channel at the version committed in the manifests.
#
# Trigger: a push to main that touches the manifests — i.e. the merge of a
# release/v* bump PR opened by prepare-release.yml. That merge IS the release
# approval; this workflow reads the now-committed version and fans out to every
# registry. (prepare-release.yml handles the toolchain's repository_dispatch and
# the human gate — see packaging.md C5.)
#
# Idempotent on push: if the committed version is already on npm (the cutover to
# this flow, or a stray manifest edit), the publish cleanly no-ops. A manual
# workflow_dispatch always runs, so a partially-failed release can be re-driven.
#
# Manual re-run: "Run workflow" (workflow_dispatch), optionally overriding the
# version, e.g. to re-publish a channel that failed.
#
# VSIX-only re-drive: dispatch from main with vsix_only=true (and the version)
# to publish ONLY the extension to VS Code Marketplace + Open VSX — every other
# channel is skipped, so a failed extension publish can be retried without
# re-running npm, PyPI, brew, or twf-view (whose release upload --clobbers).
#
# No-publish check: dispatch with verify_trusted_publishing=true. Every publish
# job is skipped; the VSIX registries only exchange an OIDC token, proving their
# trusted-publisher registrations match. It runs in its own concurrency group,
# so it never queues against (or displaces) a real release.
#
# Publishing runs only from main: a dispatch on any other ref fails unless it is
# a verify run (the trusted-publisher registrations are not branch-bound).
#
# NOTE: the filename _consume-release.yml is load-bearing — npm and Open VSX
# trusted publishing (OIDC) validate this top-level caller workflow filename,
# and the VS Code Marketplace policy is registered against it too. Do NOT rename
# it without updating every registry's trusted-publisher config first.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "packages/vscode/package.json"
      - "packages/npm/**/package.json"
      - "packages/payload/package.json"
      - "packages/serve/package.json"
      - "packages/pypi/twf-cli/pyproject.toml"
      - "packages/pypi/twf-cli/src/twf_cli/__init__.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the committed manifest version)"
        required: false
        type: string
      verify_trusted_publishing:
        description: "Publish nothing; only check the VSIX registries' trusted publishing (token exchange)"
        required: false
        type: boolean
        default: false
      vsix_only:
        description: "Publish ONLY the VSIX (VS Code Marketplace + Open VSX); skip every other channel"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.verify_trusted_publishing && 'verify-trusted-publishing' || 'publish-release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      vsix_only: ${{ steps.v.outputs.vsix_only }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          fi
          V="${V#v}"
          [ -n "$V" ] && [ "$V" != "null" ] || { echo "::error::could not resolve version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # On an automatic push, don't re-publish a version that already exists
          # on npm (the cutover to this flow, or a stray manifest edit) — skip the
          # whole fan-out. A manual dispatch always publishes, so a partially
          # failed release can be re-driven.
          publish=true
          vsix_only=false
          if [ "${{ inputs.verify_trusted_publishing }}" = "true" ]; then
            echo "verify_trusted_publishing: publishing nothing."
            publish=false
          elif [ "$REF" != "refs/heads/main" ]; then
            echo "::error::refusing to publish from $REF — releases publish only from main (verify_trusted_publishing works from any ref)"
            exit 1
          elif [ "${{ inputs.vsix_only }}" = "true" ]; then
            echo "vsix_only: publishing only the VSIX."
            publish=false
            vsix_only=true
          elif [ "${{ github.event_name }}" = "push" ] && npm view "@temporal-architect/twf@$V" version >/dev/null 2>&1; then
            echo "v$V is already published to npm — nothing to do."
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "vsix_only=$vsix_only" >> "$GITHUB_OUTPUT"
          echo "Resolved v$V (publish=$publish, vsix_only=$vsix_only)"

  check-versions:
    needs: resolve-version
    if: needs.resolve-version.outputs.publish == 'true'
    uses: ./.github/workflows/_check-versions.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-vsix:
    # Independent of npm: the extension builds against the wire-types tarball from
    # the toolchain Release (see Makefile stamp-versions), not the published package.
    needs: [resolve-version, check-versions]
    # Trusted publishing (OIDC) to both registries — no VSCE/OVSX tokens.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-vsix.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  # vsix_only re-drive: the same pre-flight + VSIX publish as a full release,
  # gated on its own output so no other channel's job (all of which need the
  # full-release check-versions above) can run.
  check-versions-vsix-only:
    needs: resolve-version
    if: needs.resolve-version.outputs.vsix_only == 'true'
    uses: ./.github/workflows/_check-versions.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-vsix-only:
    needs: [resolve-version, check-versions-vsix-only]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-vsix.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  verify-vsix-trusted-publishing:
    needs: resolve-version
    if: ${{ inputs.verify_trusted_publishing }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-vsix.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      verify_only: true

  # npm channels authenticate via trusted publishing (OIDC) — no NPM_TOKEN.
  # npm validates the *calling* (top-level) workflow filename, so the trusted
  # publisher for every @temporal-architect/* package published HERE is
  # configured on npmjs.com as repo=temporal-architect-dist,
  # workflow=_consume-release.yml. id-token:write must be granted on BOTH this
  # caller job and the reusable workflow it calls.
  #
  # The visualizer + wire-types LIBRARIES are not published here — the toolchain
  # publishes them (repository.url = toolchain, so provenance succeeds). This
  # repo only consumes their Release tarballs at build time.
  publish-npm-twf:
    needs: [resolve-version, check-versions]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-twf.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  # @temporal-architect/payload + serve — the shared toolchain-interpretation
  # library and the Node/npx visualizer server. Ordered AFTER publish-npm-twf so
  # that when the serve publish job `npm install`s its own deps for the build,
  # both payload@vX (published first inside this workflow) and twf@vX are already
  # on the registry. Same OIDC caller (_consume-release.yml) — the npm
  # trusted-publisher config on npmjs.com must list both new packages.
  publish-npm-serve:
    needs: [resolve-version, check-versions, publish-npm-twf]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-serve.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-pypi:
    needs: [resolve-version, check-versions]
    uses: ./.github/workflows/_publish-pypi.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-npm-claude-plugin:
    needs: [resolve-version, check-versions]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-claude-plugin.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-brew:
    # The toolchain Release already exists (it triggered this run), so the
    # formula's URLs + SHAs are pinnable immediately.
    needs: [resolve-version, check-versions]
    uses: ./.github/workflows/_publish-brew.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # twf-view is the only channel BUILT here (dist-owned Go source, not a
  # toolchain binary). This cross-compiles it, publishes a dist GitHub Release
  # with the archives (whose tag also backs `go install …/twf-view@vX`), and
  # bumps Formula/twf-view.rb. Independent of the npm/pypi/vsix fan-out.
  publish-twf-view:
    needs: [resolve-version, check-versions]
    permissions:
      contents: write
    uses: ./.github/workflows/_release-twf-view.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
